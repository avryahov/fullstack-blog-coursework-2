services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-blog}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-blog}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-fullstack-blog-coursework-2}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fullstack-network

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-blog}:${MONGO_ROOT_PASSWORD:-blog}@mongo:27017/${MONGO_DATABASE:-fullstack-blog-coursework-2}?authSource=admin
      CLIENT_ORIGIN: ${BACKEND_CLIENT_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${BACKEND_JWT_SECRET:-change-me}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - fullstack-network

  frontend:
    build:
      context: ./Frontend
      args:
        REACT_APP_API_URL: ${FRONTEND_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fullstack-network

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./DevOps/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fullstack-network

volumes:
  mongo-data:

networks:
  fullstack-network:
